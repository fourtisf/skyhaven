# nginx reverse proxy for the Volari realtime (Colyseus) server.
# rt.volari.fun → wss → 127.0.0.1:2567
#
#   sudo cp deploy/nginx/rt.volari.fun.conf /etc/nginx/sites-available/rt.volari.fun
#   sudo ln -sf /etc/nginx/sites-available/rt.volari.fun /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d rt.volari.fun     # REQUIRED — the web uses wss://
#
# DNS prerequisite: A record  rt → <server ip>  (certbot needs it to verify).

server {
    listen 80;
    listen [::]:80;
    server_name rt.volari.fun;

    location / {
        proxy_pass http://127.0.0.1:2567;
        proxy_http_version 1.1;

        # WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep long-lived game sockets open (default 60s would drop them).
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
