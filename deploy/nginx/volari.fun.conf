# nginx reverse proxy for volari.fun → Next.js web shell on :3000
#
# Install:
#   sudo cp deploy/nginx/volari.fun.conf /etc/nginx/sites-available/volari.fun
#   sudo ln -s /etc/nginx/sites-available/volari.fun /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d volari.fun -d www.volari.fun   # HTTPS (Let's Encrypt)
#
# certbot rewrites this file to add the TLS listener + redirect automatically.

server {
    listen 80;
    listen [::]:80;
    server_name volari.fun www.volari.fun;

    # Next.js web shell (PM2: volari-web)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Phase 2+: expose the Colyseus realtime + Fastify API ──
