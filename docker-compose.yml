# Local infra for Skyhaven development.
# `pnpm infra:up` to start, `pnpm infra:down` to stop.
services:
  postgres:
    image: postgres:16-alpine
    container_name: skyhaven-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: skyhaven
      POSTGRES_PASSWORD: skyhaven
      POSTGRES_DB: skyhaven
    ports:
      - "5432:5432"
    volumes:
      - skyhaven-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyhaven"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: skyhaven-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - skyhaven-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  skyhaven-pgdata:
  skyhaven-redisdata:
